[project]
name = "stitchwork-renderer-epub"
version = "0.1.0"
description = "EPUB 3.3 renderer for Stitchwork (pandoc + ebooklib hybrid)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
  "click>=8.1.7",
  "ebooklib>=0.18",
  "lxml>=5.3.0",
]

[project.optional-dependencies]
pandoc = ["pypandoc>=1.13"]
dev = ["pytest>=8.3.0", "ruff>=0.6.0"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitchwork_renderer_epub"]
