[project]
name = "stitchwork-workers"
version = "0.1.0"
description = "Python renderer workers for Stitchwork (Typst, EPUB, visual, audio)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Stitchwork contributors" }]

dependencies = [
  "jsonschema>=4.23.0",
  "pyyaml>=6.0.2",
  "pydantic>=2.9.0",
  "rich>=13.8.0",
  "click>=8.1.7",
]

[project.optional-dependencies]
print = [
  "typst>=0.13.0",
]
epub = [
  "ebooklib>=0.18",
  "pypandoc>=1.13",
  "lxml>=5.3.0",
]
visual = [
  "matplotlib>=3.9.0",
  "playwright>=1.47.0",
  "Pillow>=10.4.0",
]
audio = [
  "openai-whisper>=20240930",
  "elevenlabs>=1.9.0",
  "soundfile>=0.12.1",
]
provenance = [
  "py-c2pa>=0.4.0; sys_platform != 'win32'",
]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/renderer-typst",
  "packages/renderer-epub",
  "packages/renderer-visual",
  "packages/renderer-audio",
  "packages/renderer-aplus",
  "packages/provenance",
  "packages/lockfile",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["packages"]
python_files = ["test_*.py", "*_test.py"]
