name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TS (${{ matrix.os }} / node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  py:
    name: Python (${{ matrix.os }} / python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest

  external-validators:
    name: Validators (EPUBCheck + Ace + Ghostscript)
    runs-on: ubuntu-latest
    needs: [ts, py]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install EPUBCheck
        run: |
          curl -sSL https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip -o epubcheck.zip
          unzip -q epubcheck.zip -d /opt
          echo "EPUBCHECK_JAR=/opt/epubcheck-5.1.0/epubcheck.jar" >> $GITHUB_ENV
      - name: Install Ace by DAISY
        run: npm install -g @daisy/ace
      - name: Install Ghostscript + Pandoc + Typst
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript pandoc
          curl -sSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz -o typst.tar.xz
          mkdir -p /opt/typst && tar -xJf typst.tar.xz -C /opt/typst --strip-components=1
          echo "/opt/typst" >> $GITHUB_PATH
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-extras
      - run: pnpm build
      - name: Build sample book (all targets)
        run: pnpm stitchwork build packages/sample-book/ai-indian-advocate --target all
      - name: Validate sample book
        run: pnpm stitchwork validate packages/sample-book/ai-indian-advocate
